<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>找候选人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .stage{ padding: 16px 18px 24px; display:flex; flex-direction:column; gap:14px; }
  .search-row{ display:flex; gap:8px; }
  .search-row select{ flex:1; }
  .stage-label{ font-size:11px; color:var(--ink-soft); font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  .stage-label b{ color:var(--pink-deep); }

  .card{
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:16px 16px 14px; box-shadow:var(--shadow); margin-bottom:12px;
  }
  .src-tag{ position:absolute; top:14px; right:14px; font-size:9.5px; font-weight:800; padding:3px 8px; border-radius:999px; background:#f1e4e8; color:var(--ink-soft); }
  .row1{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; padding-right:60px;}
  .zone{ font-family:'Fraunces'; font-weight:700; font-size:18px; color:var(--ink); }
  .zone span{ display:block; font-family:'Noto Sans SC'; font-weight:500; font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .price-tag{ background:var(--pink-pale); color:var(--pink-deep); font-weight:800; font-size:13px; padding:5px 10px; border-radius:999px; white-space:nowrap; }
  .row-compare{ display:flex; gap:8px; margin-bottom:10px; }
  .pill{ flex:1; text-align:center; border-radius:12px; padding:8px 4px; font-size:11px; font-weight:700; background:#fdf1f5; color:var(--ink-soft); }
  .pill b{ display:block; font-size:13px; color:var(--ink); font-weight:800; margin-top:1px;}
  .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tag{ font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px; background:#fbe6ee; color:var(--pink-deep); }
  .actions{ display:flex; justify-content:center; gap:20px; margin-top:4px; padding:4px 0 6px; }
  .btn-circle{ width:50px; height:50px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 20px -8px rgba(0,0,0,.25); cursor:pointer; }
  .btn-nope{ background:#fff; border:2px solid #f4d9e0; color:#c23a5e; }
  .btn-like{ background:linear-gradient(135deg,var(--pink-mid),var(--pink-deep)); color:#fff; }
  .unlocked{ background:linear-gradient(180deg,#fff,#fff8fb); border:1.5px solid var(--green); }
  .unlocked-tip{ display:flex; align-items:center; gap:6px; color:var(--green); font-weight:800; font-size:12px; margin-bottom:10px; }
  .contact-row{ display:flex; flex-direction:column; gap:6px; background:#f4fbf7; border-radius:12px; padding:10px 11px; margin-bottom:10px; font-size:12px; }
  .contact-row div b{ color:var(--ink-soft); font-weight:700; margin-right:6px; }
  .flag-link{ text-align:center; font-size:10.5px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; margin-top:4px; }

  .pw-gate{ padding:40px 24px; text-align:center; }
  .pw-gate input{ margin-bottom:12px; }

  .back-link{ display:block; text-align:center; padding:14px; font-size:12px; color:var(--ink-soft); text-decoration:none; }
</style>
</head>
<body>
<div class="phone">
  <header class="top">
    <div class="top-row"><div class="brand">Seat Swap</div><div class="watermark">YBW_Sgz</div></div>
    <h1 id="pageTitle">找候选人</h1>
    <div class="sub" id="pageSub">加载中...</div>
  </header>

  <div id="pwGate" class="pw-gate" style="display:none;">
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">这是博文家专属入口,请输入口令</p>
    <input type="password" id="pwInput" placeholder="输入口令">
    <button class="btn-primary" onclick="submitPassword()">进入</button>
    <div id="pwError" class="warn-box" style="display:none; margin-top:12px;"></div>
  </div>

  <div id="mainStage" class="stage" style="display:none;">
    <div class="field">
      <label>演出场次</label>
      <select id="fShowDate" onchange="runSearch()">
        <option value="">全部场次</option>
        <option>8.13</option><option>8.14</option><option>8.16</option><option>8.17</option>
      </select>
    </div>
    <div class="field" id="fCategoryField">
      <label>想找哪个分类的座位</label>
      <select id="fCategory" onchange="onFCategoryChange()"></select>
    </div>
    <div class="field">
      <label>想找哪个票价</label>
      <select id="fPrice" onchange="onFPriceChange()" disabled><option value="">请先选分类</option></select>
    </div>
    <div class="field">
      <label>具体分区(可不选,不选就看该价位下所有人)</label>
      <select id="fZone" disabled><option value="">全部分区</option></select>
    </div>
    <button class="btn-primary" onclick="runSearch()" style="margin-bottom:6px;">搜索</button>

    <div class="stage-label"><span>共 <b id="resultCount">0</b> 位候选人</span></div>
    <div id="results"></div>
  </div>

  <a class="back-link" href="index.html">← 返回首页</a>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/zones-data.js"></script>
<script>
const sb = window.getSupabaseClient();
const params = new URLSearchParams(location.search);
const mode = params.get('mode') === 'internal' ? 'internal' : 'public';
let internalPassword = sessionStorage.getItem('seatswap_internal_pw') || null;

const fCategorySel = document.getElementById('fCategory');
const fPriceSel = document.getElementById('fPrice');
const fZoneSel = document.getElementById('fZone');

function init(){
  if(mode === 'internal'){
    document.getElementById('pageTitle').textContent = '博文家专属入口';
    document.getElementById('fCategoryField').style.display = '';
    CATEGORY_DATA.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name; opt.textContent = c.name;
      fCategorySel.appendChild(opt);
    });
    if(internalPassword){
      showMainStage();
    } else {
      document.getElementById('pwGate').style.display = 'block';
    }
  } else {
    document.getElementById('pageTitle').textContent = '对外查询';
    document.getElementById('pageSub').textContent = '博文家 · 非主攻区愿意换出的票';
    document.getElementById('fCategoryField').style.display = 'none';
    // 公开入口固定只查非主攻区
    fCategorySel.innerHTML = '<option value="非主攻区">非主攻区</option>';
    onFCategoryChange();
    showMainStage();
  }
}

function applyPresets(){
  const presetShow = params.get('presetShowDate');
  const presetCat = params.get('presetCategory');
  const presetPrice = params.get('presetPrice');
  const presetZone = params.get('presetZone');

  if(presetShow) document.getElementById('fShowDate').value = presetShow;

  if(mode === 'internal' && presetCat){
    fCategorySel.value = presetCat;
    onFCategoryChange();
  }
  if(presetPrice){
    fPriceSel.value = presetPrice;
    onFPriceChange();
  }
  if(presetZone){
    fZoneSel.value = presetZone;
  }
}

function showMainStage(){
  document.getElementById('pwGate').style.display = 'none';
  document.getElementById('mainStage').style.display = 'flex';
  document.getElementById('pageSub').textContent = mode === 'internal' ? '全部换座信息' : '博文家 · 非主攻区愿意换出的票';
  if(mode === 'internal') onFCategoryChange();
  applyPresets();
  runSearch();
}

async function submitPassword(){
  const pw = document.getElementById('pwInput').value;
  const errBox = document.getElementById('pwError');
  errBox.style.display = 'none';
  if(!pw) return;
  try {
    const res = await fetch('/.netlify/functions/full-data', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw }),
    });
    if(res.status === 401){
      errBox.textContent = '⚠ 口令不对,请再试一次';
      errBox.style.display = 'block';
      return;
    }
    if(!res.ok) throw new Error('网络错误');
    internalPassword = pw;
    sessionStorage.setItem('seatswap_internal_pw', pw);
    showMainStage();
  } catch(err){
    errBox.textContent = '⚠ ' + err.message;
    errBox.style.display = 'block';
  }
}

function onFCategoryChange(){
  const catName = fCategorySel.value;
  fZoneSel.innerHTML = '<option value="">全部分区</option>';
  fZoneSel.disabled = true;
  if(!catName){
    fPriceSel.disabled = true;
    fPriceSel.innerHTML = '<option value="">请先选分类</option>';
    return;
  }
  fPriceSel.disabled = false;
  const cat = CATEGORY_DATA.find(c => c.name === catName);
  const prices = [...new Set(cat.zones.map(z => z.price))].sort((a,b)=>a-b);
  fPriceSel.innerHTML = '<option value="">全部价位</option>' + prices.map(p => `<option value="${p}">¥${p}</option>`).join('');
}

function onFPriceChange(){
  const catName = fCategorySel.value;
  const price = parseInt(fPriceSel.value);
  if(!catName || !price){
    fZoneSel.disabled = true;
    fZoneSel.innerHTML = '<option value="">全部分区</option>';
    return;
  }
  fZoneSel.disabled = false;
  const cat = CATEGORY_DATA.find(c => c.name === catName);
  const zones = cat.zones.filter(z => z.price === price);
  fZoneSel.innerHTML = '<option value="">全部分区</option>' + zones.map(z => `<option>${z.name}</option>`).join('');
}

let revealedIds = new Set();
let skippedIds = new Set();

async function runSearch(){
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '<div class="loading">加载中...</div>';

  const showDate = document.getElementById('fShowDate').value;
  const category = fCategorySel.value;
  const price = fPriceSel.value;
  const zone = fZoneSel.value;

  let rows = [];
  try {
    if(mode === 'internal'){
      const res = await fetch('/.netlify/functions/full-data', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: internalPassword, showDate: showDate || undefined, category: category || undefined }),
      });
      if(res.status === 401){
        sessionStorage.removeItem('seatswap_internal_pw');
        internalPassword = null;
        document.getElementById('pwGate').style.display = 'block';
        document.getElementById('mainStage').style.display = 'none';
        return;
      }
      const json = await res.json();
      rows = json.data || [];
      if(price) rows = rows.filter(r => r.current_price === parseInt(price));
      if(zone) rows = rows.filter(r => r.current_zone === zone);
    } else {
      let query = sb.from('submissions').select('*')
        .eq('status','active').eq('source_type','self').eq('current_category','非主攻区')
        .order('created_at', { ascending:true });
      if(showDate) query = query.eq('show_date', showDate);
      if(price) query = query.eq('current_price', parseInt(price));
      if(zone) query = query.eq('current_zone', zone);
      const { data, error } = await query;
      if(error) throw error;
      rows = data || [];
    }
  } catch(err){
    resultsEl.innerHTML = `<div class="loading">加载失败:${err.message}</div>`;
    return;
  }

  rows = rows.filter(r => !skippedIds.has(r.id));
  document.getElementById('resultCount').textContent = rows.length;

  if(rows.length === 0){
    resultsEl.innerHTML = '<div class="loading">暂时没有符合条件的候选人</div>';
    return;
  }

  resultsEl.innerHTML = rows.map(r => renderCard(r)).join('');
}

function renderCard(r){
  const unlocked = revealedIds.has(r.id);
  const srcTag = r.source_type === 'external' ? '入口二登记' : '本人登记';
  if(unlocked){
    return `
      <div class="card unlocked">
        <span class="src-tag">${srcTag}</span>
        <div class="unlocked-tip">✓ 已解锁联系方式</div>
        <div class="row1" style="padding-right:0;">
          <div class="zone">${r.current_zone}<span>${r.current_category} · ${r.current_row || '排数未填'}</span></div>
          <div class="price-tag">¥${r.current_price}</div>
        </div>
        <div class="contact-row">
          <div><b>微博</b>${escapeHtml(r.weibo_id)}</div>
          <div><b>链接</b>${escapeHtml(r.weibo_link)}</div>
          <div><b>小红书</b>${escapeHtml(r.xhs_id)}</div>
          <div><b>抖音</b>${escapeHtml(r.dy_id)}</div>
        </div>
        <div class="flag-link" onclick="flagAsMatched('${r.id}')">这个人已经换过票了?点这里告诉我们</div>
      </div>`;
  }
  const intent = (r.intent_zones || []).slice(0,3).map(z => z.zone).join('、') || '未填意向分区';
  return `
    <div class="card">
      <span class="src-tag">${srcTag}</span>
      <div class="row1">
        <div class="zone">${r.current_zone}<span>${r.current_category} · ${r.current_row || '排数未填'} · ${r.show_date}</span></div>
        <div class="price-tag">¥${r.current_price}</div>
      </div>
      <div class="row-compare">
        <div class="pill">意向分区<b style="font-size:11px;">${intent}</b></div>
        <div class="pill">最高接受<b>${r.max_accept_price ? '¥'+r.max_accept_price : '不限'}</b></div>
      </div>
      <div class="tags">
        ${r.same_level_ok ? `<span class="tag">同价位接受补差 ≤¥${r.same_level_amount || '?'}</span>` : ''}
      </div>
      <div class="actions">
        <button class="btn-circle btn-nope" onclick="skipCard('${r.id}')">✕</button>
        <button class="btn-circle btn-like" onclick="revealCard('${r.id}')">♥</button>
      </div>
    </div>`;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function skipCard(id){ skippedIds.add(id); runSearch(); }
function revealCard(id){ revealedIds.add(id); runSearch(); }

function getFlaggerToken(){
  let t = localStorage.getItem('seatswap_flagger_token');
  if(!t){ t = 'f_' + Math.random().toString(36).slice(2) + Date.now(); localStorage.setItem('seatswap_flagger_token', t); }
  return t;
}

async function flagAsMatched(id){
  try {
    const { error } = await sb.rpc('flag_submission_matched', { p_submission_id: id, p_flagger_token: getFlaggerToken() });
    if(error) throw error;
    alert('已收到,谢谢反馈!如果已经有2个人标记,这条信息会自动下架。');
    runSearch();
  } catch(err){
    alert('提交失败:' + err.message);
  }
}

init();
</script>
</body>
</html>
