<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>第肆象限 · 换座位</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  .portals{ padding: 24px 22px 30px; display:flex; flex-direction:column; gap:16px; }
  .entry-group{ display:flex; flex-direction:column; gap:12px; }
  .entry-group + .entry-group{ margin-top:22px; padding-top:22px; border-top:1.5px dashed var(--line); }
  .group-label{ font-size:11px; font-weight:800; color:var(--ink-soft); letter-spacing:.04em; }
  .portal-card{
    border: 1.5px solid var(--line); border-radius: 20px; padding: 20px; cursor:pointer;
    text-decoration:none; color:inherit; display:block;
  }
  .portal-card h3{ margin:0 0 6px; font-size:16px; font-family:'Fraunces'; }
  .portal-card p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .portal-card.internal{ background: linear-gradient(160deg, #fff3f7, #ffe6ef); border-color: var(--pink-pale); }
  .badge{ display:inline-block; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px; margin-bottom:8px; }
  .badge.pw{ background:var(--pink-deep); color:#fff; }
  .badge.open{ background:#e9f8ef; color:var(--green); }
</style>
</head>
<body>
<div class="phone">
  <header class="top">
    <div class="top-row">
      <div class="brand">Seat Swap</div>
      <div class="watermark">YBW_Sgz</div>
    </div>
    <h1>第肆象限 · 换座位</h1>
    <div class="sub">8.13 / 8.14 / 8.16 / 8.17</div>
  </header>

  <div class="portals">
    <div class="entry-group">
      <div class="group-label">博文家</div>
      <a class="portal-card internal" href="register.html?entry=1">
        <span class="badge pw">需要口令</span>
        <h3>博文家专属入口</h3>
        <p>先登记我的非主攻换座信息,登记成功后就能去浏览、匹配候选人。</p>
      </a>
    </div>

    <div class="entry-group">
      <div class="group-label">给别的粉丝群体用</div>
      <a class="portal-card" href="browse.html?mode=public">
        <span class="badge open">任何人都能用</span>
        <h3>对外查询</h3>
        <p>查看博文家粉丝在非主攻区、愿意换出的票信息。不需要口令,谁都能看。</p>
      </a>
      <a class="portal-card" href="register.html?entry=2">
        <span class="badge open">任何人都能用</span>
        <h3>登记我的换座信息</h3>
        <p>当前在主攻/强攻区,想换到非主攻区。不需要口令,直接可以填。</p>
      </a>
    </div>
  </div>
</div>
</body>
</html>
