<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登记换座信息</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  form{ padding: 18px 18px 90px; }
  .section-title{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; color:var(--pink-deep); margin-bottom:10px; }
  .section-title .num{ width:20px; height:20px; border-radius:50%; background:var(--pink-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:'Fraunces'; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cat-tabs{ display:flex; gap:8px; margin-bottom:10px; }
  .cat-tab{ flex:1; text-align:center; padding:10px 4px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font-size:12.5px; font-weight:800; color:var(--ink-soft); cursor:pointer; }
  .cat-tab.active{ background:var(--pink-deep); border-color:var(--pink-deep); color:#fff; }
  .cat-tab .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
  .tiers{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .tier{ border:1.5px solid var(--line); border-radius:14px; overflow:hidden; background:#fffafc; }
  .tier-head{ display:flex; align-items:center; justify-content:space-between; padding:11px 13px; cursor:pointer; }
  .tier-left{ display:flex; align-items:center; gap:9px; }
  .swatch{ width:13px; height:13px; border-radius:4px; flex-shrink:0; }
  .tier-price{ font-family:'Fraunces'; font-weight:700; font-size:14.5px; }
  .tier-note{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .note-mine{ background:#e9f8ef; color:var(--green); }
  .note-up{ background:#fdf1da; color:#9c6b12; }
  .note-down{ background:#fdeaf1; color:var(--pink-deep); }
  .chev{ font-size:11px; color:var(--ink-soft); transition:transform .2s ease; }
  .tier.open .chev{ transform:rotate(180deg); }
  .tier-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; padding:0 13px; }
  .tier.open .tier-body{ max-height:260px; padding:2px 13px 12px; }
  .zone-grid{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{ font-size:11.5px; font-weight:700; padding:7px 11px; border-radius:999px; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer; }
  .chip.sel{ background:var(--pink-deep); border-color:var(--pink-deep); color:#fff; }
  .selected-count{ font-size:11px; color:var(--ink-soft); margin-bottom:8px; }
  .selected-count b{ color:var(--pink-deep); }
  .samelevel{ background:#fff3f7; border:1px solid var(--pink-pale); border-radius:12px; padding:10px 11px 11px; margin-bottom:10px; }
  .samelevel-q{ font-size:11.5px; font-weight:700; color:var(--ink); margin-bottom:8px; line-height:1.5;}
  .toggle-row{ display:flex; gap:8px; }
  .toggle-btn{ flex:1; border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:8px; font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .toggle-btn.active{ background:var(--pink-deep); border-color:var(--pink-deep); color:#fff; }
  .amount-box{ display:none; margin-top:10px; }
  .amount-box.show{ display:block; }
  .selected-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .selected-item{ background:#fff3f7; border:1px solid var(--pink-pale); border-radius:12px; padding:10px 11px; }
  .selected-item-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .selected-item-name{ font-size:12.5px; font-weight:800; color:var(--ink); }
  .selected-item-remove{ border:none; background:none; color:var(--ink-soft); font-size:15px; cursor:pointer; }
  .upload{ border:1.5px dashed var(--line); border-radius:16px; padding:18px; text-align:center; color:var(--ink-soft); font-size:12px; font-weight:700; background:#fff8fa; cursor:pointer; }
  .upload.has-file{ border-color:var(--green); color:var(--green); background:#f4fbf7; }
  .success{ display:none; flex-direction:column; align-items:center; text-align:center; padding:40px 24px 30px; }
  .success.show{ display:flex; }
  .success-icon{ width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,var(--pink-mid),var(--pink-deep)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:30px; margin-bottom:16px; }
  .link-box{ width:100%; background:#fff3f7; border:1.5px dashed var(--pink-pale); border-radius:14px; padding:14px; font-size:12px; color:var(--pink-deep); font-weight:700; word-break:break-all; margin-bottom:14px; }
  .submit-bar{ padding: 4px 0 20px; }
</style>
</head>
<body>
<div class="phone">
  <header class="top">
    <div class="top-row"><div class="brand">Seat Swap · 登记信息</div><div class="watermark">YBW_Sgz</div></div>
    <h1 id="pageTitle">填写你的换座需求</h1>
    <div class="sub" id="pageSub">不用注册,填完会给你一个专属管理链接</div>
  </header>

  <div id="pwGate" class="pw-gate" style="display:none; padding:36px 22px;">
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">这是博文家专属入口,请输入口令</p>
    <input type="password" id="pwInput" placeholder="输入口令" style="margin-bottom:12px;">
    <button class="btn-primary" onclick="submitPassword()">进入</button>
    <div id="pwError" class="warn-box" style="display:none; margin-top:12px;"></div>
  </div>

  <form id="theForm" style="display:none;">
    <div class="field">
      <div class="section-title"><span class="num">1</span>演出场次</div>
      <select id="showDate" required>
        <option value="">请选择场次</option>
        <option>8.13</option><option>8.14</option><option>8.16</option><option>8.17</option>
      </select>
    </div>

    <div class="field">
      <div class="section-title"><span class="num">2</span>我的当前座位</div>
      <div class="field" id="myCategoryField">
        <label>分类</label>
        <select id="myCategory" onchange="onMyCategoryChange()">
          <option value="">请选择</option>
        </select>
      </div>
      <label>票价</label>
      <select id="myPrice" onchange="onMyPriceChange()" disabled>
        <option value="">请先选分类</option>
      </select>
      <label>对应分区</label>
      <select id="myZone" disabled>
        <option value="">请先选票价</option>
      </select>
      <div class="grid2">
        <div><label>排数</label><input type="text" id="myRow" placeholder="例如 5排"></div>
        <div><label>座位号</label><input type="text" id="mySeat" placeholder="例如 12号"></div>
      </div>
    </div>

    <div class="field">
      <div class="section-title"><span class="num">3</span>意向分区(可跨分类、跨价位多选)</div>
      <div class="hint-box" id="intentHint" style="margin-bottom:10px;">💡 先选强攻/主攻/非主攻,再点开价位查看具体分区。</div>
      <div class="cat-tabs" id="intentTabs"></div>
      <div class="tiers" id="tiersWrap"></div>
      <div class="selected-count">已选 <b id="selCount">0</b> 个意向分区</div>
      <div class="selected-list" id="selectedList"></div>
    </div>

    <div class="field">
      <div class="section-title"><span class="num">4</span>最高愿意补到哪个价位</div>
      <select id="maxPrice">
        <option value="">不限,以上勾选的都能接受</option>
      </select>
    </div>

    <div class="field">
      <div class="section-title"><span class="num">5</span>票据截图</div>
      <label class="upload" id="uploadBox" onclick="document.getElementById('fileInput').click()">
        <span id="uploadText">点击上传票据截图(仅展示给其他人参考,不审核)</span>
      </label>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFileChosen(this)">
    </div>

    <div class="field">
      <div class="section-title"><span class="num">6</span>联系方式</div>
      <div class="hint-box" style="margin-bottom:10px;">💡 以下六项都要填,没有的话填"/"即可</div>
      <label>微博ID</label>
      <input type="text" id="weiboId" placeholder="例如 @桃桃住海边,没有填 /">
      <label>微博主页链接</label>
      <input type="text" id="weiboLink" placeholder="粘贴你的微博主页链接,没有填 /">
      <label>小红书ID</label>
      <input type="text" id="xhsId" placeholder="没有填 /">
      <label>抖音ID</label>
      <input type="text" id="dyId" placeholder="没有填 /">
      <label>微信号</label>
      <input type="text" id="wechatId" placeholder="没有填 /">
      <label>手机号</label>
      <input type="text" id="phoneNum" placeholder="没有填 /">
    </div>

    <div id="formError" class="warn-box" style="display:none; margin-bottom:14px;"></div>

    <div class="submit-bar">
      <button type="submit" id="submitBtn" class="btn-primary">提交换座信息</button>
    </div>
  </form>

  <div class="success" id="successScreen">
    <div class="success-icon">✓</div>
    <h2>提交成功</h2>
    <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 20px;">
      你的换座信息已经在池子里啦。<br>请务必保存下面这个专属链接 —— 以后修改信息、标记"已完成换票"都要靠它。
    </p>
    <div class="link-box" id="magicLink"></div>
    <button class="btn-secondary" onclick="copyLink()" style="margin-bottom:10px;">复制链接</button>
    <a id="findMatchBtn" class="btn-primary" style="text-decoration:none; display:block;">→ 去找候选人</a>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/zones-data.js"></script>
<script>
const sb = window.getSupabaseClient();
const entry = new URLSearchParams(location.search).get('entry') === '2' ? 2 : 1;

// 入口一(需要口令):只能登记"非主攻区"当前座位,来源 self,意向只能选主攻/强攻
// 入口二(不需要口令):只能登记"主攻区/强攻区"当前座位,来源 external,意向只能选非主攻
const ENTRY_CONFIG = {
  1: {
    sourceType: 'self',
    currentCategories: ['非主攻区'],
    intentCategories: ['主攻区','强攻区'],
    needsPassword: true,
    title: '填写你的换座需求',
    sub: '博文家专属登记 · 从非主攻换到主攻/强攻',
  },
  2: {
    sourceType: 'external',
    currentCategories: ['主攻区','强攻区'],
    intentCategories: ['非主攻区'],
    needsPassword: false,
    title: '登记你的换座信息',
    sub: '当前在主攻/强攻区,想换到非主攻区',
  },
};
const cfg = ENTRY_CONFIG[entry];
document.getElementById('pageTitle').textContent = cfg.title;
document.getElementById('pageSub').textContent = cfg.sub;

let unlocked = !cfg.needsPassword;

function initGate(){
  if(unlocked){
    document.getElementById('theForm').style.display = 'block';
    setupForm();
    return;
  }
  const pw = sessionStorage.getItem('seatswap_internal_pw');
  if(pw){
    unlocked = true;
    document.getElementById('theForm').style.display = 'block';
    setupForm();
  } else {
    document.getElementById('pwGate').style.display = 'block';
  }
}

async function submitPassword(){
  const pw = document.getElementById('pwInput').value;
  const errBox = document.getElementById('pwError');
  errBox.style.display = 'none';
  if(!pw) return;
  try {
    const res = await fetch('/.netlify/functions/full-data', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw }),
    });
    if(res.status === 401){
      errBox.textContent = '⚠ 口令不对,请再试一次';
      errBox.style.display = 'block';
      return;
    }
    if(!res.ok) throw new Error('网络错误');
    sessionStorage.setItem('seatswap_internal_pw', pw);
    unlocked = true;
    document.getElementById('pwGate').style.display = 'none';
    document.getElementById('theForm').style.display = 'block';
    setupForm();
  } catch(err){
    errBox.textContent = '⚠ ' + err.message;
    errBox.style.display = 'block';
  }
}

const myCategorySel = document.getElementById('myCategory');
const myPriceSel = document.getElementById('myPrice');
const myZoneSel = document.getElementById('myZone');
const maxPriceSel = document.getElementById('maxPrice');
const tiersWrap = document.getElementById('tiersWrap');
const intentTabs = document.getElementById('intentTabs');

const availableCurrentCats = CATEGORY_DATA.filter(c => cfg.currentCategories.includes(c.name));
const availableIntentCats = CATEGORY_DATA.filter(c => cfg.intentCategories.includes(c.name));

function setupForm(){
  // 当前座位分类:如果只有一个选项,直接锁定隐藏掉下拉,减少多余的一步
  if(availableCurrentCats.length === 1){
    document.getElementById('myCategoryField').style.display = 'none';
    myCategorySel.innerHTML = `<option value="${availableCurrentCats[0].name}">${availableCurrentCats[0].name}</option>`;
    myCategorySel.value = availableCurrentCats[0].name;
    onMyCategoryChange();
  } else {
    myCategorySel.innerHTML = '<option value="">请选择</option>' + availableCurrentCats.map(c => `<option>${c.name}</option>`).join('');
  }

  const allPrices = [...new Set(CATEGORY_DATA.flatMap(c => c.zones.map(z => z.price)))].sort((a,b)=>a-b);
  allPrices.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = `¥${p}`;
    maxPriceSel.appendChild(opt);
  });

  activeIntentCat = availableIntentCats[0].name;
  document.getElementById('intentHint').textContent = availableIntentCats.length > 1
    ? '💡 先选强攻/主攻,再点开价位查看具体分区。'
    : `💡 点开价位查看${availableIntentCats[0].name}下的具体分区。`;
  buildIntentTabs();
  buildTiers();
}

function onMyCategoryChange(){
  const catName = myCategorySel.value;
  myZoneSel.innerHTML = '<option value="">请先选票价</option>';
  myZoneSel.disabled = true;
  if(!catName){
    myPriceSel.disabled = true;
    myPriceSel.innerHTML = '<option value="">请先选分类</option>';
  } else {
    myPriceSel.disabled = false;
    const cat = CATEGORY_DATA.find(c => c.name === catName);
    const prices = [...new Set(cat.zones.map(z => z.price))].sort((a,b)=>a-b);
    myPriceSel.innerHTML = '<option value="">请选择票价</option>' + prices.map(p => `<option value="${p}">¥${p}</option>`).join('');
  }
}

function onMyPriceChange(){
  const catName = myCategorySel.value;
  const price = parseInt(myPriceSel.value);
  if(!catName || !price){
    myZoneSel.disabled = true;
    myZoneSel.innerHTML = '<option value="">请先选票价</option>';
  } else {
    myZoneSel.disabled = false;
    const cat = CATEGORY_DATA.find(c => c.name === catName);
    const zones = cat.zones.filter(z => z.price === price);
    myZoneSel.innerHTML = '<option value="">请选择分区</option>' + zones.map(z => `<option>${z.name}</option>`).join('');
  }
  buildTiers();
}

let activeIntentCat = null;
let selectedZones = new Set();
let rowPrefs = {};

function buildIntentTabs(){
  if(availableIntentCats.length <= 1){ intentTabs.innerHTML = ''; return; }
  intentTabs.innerHTML = availableIntentCats.map(c => `
    <div class="cat-tab ${c.name === activeIntentCat ? 'active':''}" onclick="switchIntentTab('${c.name}')">
      <span class="dot" style="background:${c.color}"></span>${c.name}
    </div>`).join('');
}

function switchIntentTab(name){ activeIntentCat = name; buildIntentTabs(); buildTiers(); }

function buildTiers(){
  if(!activeIntentCat) return;
  const myPrice = parseInt(myPriceSel.value) || null;
  const cat = CATEGORY_DATA.find(c => c.name === activeIntentCat);
  const prices = [...new Set(cat.zones.map(z => z.price))].sort((a,b)=>a-b);
  tiersWrap.innerHTML = '';
  prices.forEach(price => {
    const zones = cat.zones.filter(z => z.price === price);
    const wrap = document.createElement('div');
    wrap.className = 'tier';
    let note = '', isMine = false;
    if(myPrice){
      if(price === myPrice){ note = `<span class="tier-note note-mine">我的档位·平级换</span>`; isMine = true; }
      else if(price > myPrice) note = `<span class="tier-note note-up">需要补差价</span>`;
      else note = `<span class="tier-note note-down">可降舱·对方补你差价</span>`;
    }
    const sameLevelBlock = isMine ? `
      <div class="samelevel">
        <div class="samelevel-q">同价位换票,如果排数差很多,你愿意补差价吗?</div>
        <div class="toggle-row">
          <button type="button" class="toggle-btn" data-val="no" onclick="setSameLevel(this,'no')">不愿意</button>
          <button type="button" class="toggle-btn" data-val="yes" onclick="setSameLevel(this,'yes')">愿意</button>
        </div>
        <div class="amount-box" id="sameLevelAmountBox">
          <label>最多愿意补多少钱</label>
          <input type="text" id="sameLevelValue" placeholder="例如 100">
        </div>
      </div>` : '';
    wrap.innerHTML = `
      <div class="tier-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="tier-left"><span class="swatch" style="background:${cat.color}"></span><span class="tier-price">¥${price}</span>${note}</div>
        <span class="chev">▾</span>
      </div>
      <div class="tier-body">
        ${sameLevelBlock}
        <div class="zone-grid">
          ${zones.map(z => `<span class="chip ${selectedZones.has(z.name)?'sel':''}" data-zone="${z.name}" onclick="toggleChip(this)">${z.name}</span>`).join('')}
        </div>
      </div>`;
    tiersWrap.appendChild(wrap);
  });
}

function setSameLevel(btn, val){
  const group = btn.closest('.samelevel');
  group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  group.querySelector('.amount-box').classList.toggle('show', val === 'yes');
  window._sameLevelOk = val === 'yes';
}

function toggleChip(el){
  el.classList.toggle('sel');
  const zone = el.dataset.zone;
  if(el.classList.contains('sel')){
    selectedZones.add(zone);
    if(!rowPrefs[zone]) rowPrefs[zone] = { limited:false, value:'' };
  } else {
    selectedZones.delete(zone);
    delete rowPrefs[zone];
  }
  document.getElementById('selCount').textContent = selectedZones.size;
  renderSelectedList();
}

function renderSelectedList(){
  const wrap = document.getElementById('selectedList');
  if(selectedZones.size === 0){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = [...selectedZones].map(zone => {
    const pref = rowPrefs[zone] || { limited:false, value:'' };
    return `
      <div class="selected-item">
        <div class="selected-item-head">
          <span class="selected-item-name">${zone}</span>
          <button type="button" class="selected-item-remove" onclick="removeZone('${zone}')">✕</button>
        </div>
        <div class="toggle-row">
          <button type="button" class="toggle-btn ${!pref.limited?'active':''}" onclick="setRowLimit('${zone}', false)">不限制排数</button>
          <button type="button" class="toggle-btn ${pref.limited?'active':''}" onclick="setRowLimit('${zone}', true)">限制排数</button>
        </div>
        <div class="amount-box ${pref.limited?'show':''}">
          <label>想要的排数</label>
          <input type="text" placeholder="例如 5排以内" value="${pref.value}" oninput="setRowValue('${zone}', this.value)">
        </div>
      </div>`;
  }).join('');
}

function removeZone(zone){
  selectedZones.delete(zone); delete rowPrefs[zone];
  document.getElementById('selCount').textContent = selectedZones.size;
  document.querySelectorAll(`.chip[data-zone="${zone}"]`).forEach(c => c.classList.remove('sel'));
  renderSelectedList();
}
function setRowLimit(zone, limited){ rowPrefs[zone].limited = limited; renderSelectedList(); }
function setRowValue(zone, value){ rowPrefs[zone].value = value; }

let chosenFile = null;
function onFileChosen(input){
  const box = document.getElementById('uploadBox');
  const text = document.getElementById('uploadText');
  if(input.files && input.files[0]){
    chosenFile = input.files[0];
    box.classList.add('has-file');
    text.textContent = '✓ 已选择:' + chosenFile.name;
  }
}

function showError(msg){
  const box = document.getElementById('formError');
  box.textContent = '⚠ ' + msg;
  box.style.display = 'block';
}
function clearError(){ document.getElementById('formError').style.display = 'none'; }

document.getElementById('theForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();

  const showDate = document.getElementById('showDate').value;
  const category = myCategorySel.value;
  const price = parseInt(myPriceSel.value);
  const zone = myZoneSel.value;
  const weiboId = document.getElementById('weiboId').value.trim();
  const weiboLink = document.getElementById('weiboLink').value.trim();
  const xhsId = document.getElementById('xhsId').value.trim();
  const dyId = document.getElementById('dyId').value.trim();
  const wechatId = document.getElementById('wechatId').value.trim();
  const phoneNum = document.getElementById('phoneNum').value.trim();

  if(!showDate) return showError('请选择演出场次');
  if(!category || !price || !zone) return showError('请填完整"我的当前座位"');
  if(!weiboId || !weiboLink || !xhsId || !dyId || !wechatId || !phoneNum) return showError('联系方式六项都要填,没有请填 /');

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = '提交中...';

  try {
    let ticketImageUrl = null;
    if(chosenFile){
      const fileExt = chosenFile.name.split('.').pop();
      const filePath = `${Date.now()}-${Math.random().toString(36).slice(2)}.${fileExt}`;
      const { error: uploadError } = await sb.storage.from('ticket-screenshots').upload(filePath, chosenFile);
      if(uploadError) throw new Error('票据截图上传失败:' + uploadError.message);
      const { data: publicUrlData } = sb.storage.from('ticket-screenshots').getPublicUrl(filePath);
      ticketImageUrl = publicUrlData.publicUrl;
    }

    const intentZones = [...selectedZones].map(zoneName => {
      const z = window.findZone(zoneName);
      const pref = rowPrefs[zoneName] || { limited:false, value:'' };
      return {
        zone: zoneName, category: z.category, price: z.price,
        row_limited: pref.limited, row_pref: pref.limited ? pref.value : null,
      };
    });

    const row = {
      show_date: showDate,
      source_type: cfg.sourceType,
      current_category: category,
      current_zone: zone,
      current_price: price,
      current_row: document.getElementById('myRow').value.trim() || null,
      current_seat: document.getElementById('mySeat').value.trim() || null,
      intent_zones: intentZones,
      max_accept_price: maxPriceSel.value ? parseInt(maxPriceSel.value) : null,
      same_level_ok: !!window._sameLevelOk,
      same_level_amount: window._sameLevelOk ? (parseInt(document.getElementById('sameLevelValue')?.value) || null) : null,
      ticket_image_url: ticketImageUrl,
      weibo_id: weiboId, weibo_link: weiboLink, xhs_id: xhsId, dy_id: dyId,
      wechat_id: wechatId, phone: phoneNum,
    };

    const { data, error } = await sb.from('submissions').insert(row).select('edit_token').single();
    if(error) throw error;

    const link = `${location.origin}${location.pathname.replace('register.html','edit.html')}?token=${data.edit_token}`;
    document.getElementById('magicLink').textContent = link;
    document.getElementById('theForm').style.display = 'none';
    document.getElementById('successScreen').classList.add('show');

    // 提交完成后,直接把用户带去"找候选人"的浏览页面,并且预先按他填的第一个意向分区搜索
    // 入口一(自己非主攻,想换主攻/强攻)→ 去博文家专属入口(口令已经验证过,session里有);
    // 入口二(别家主攻/强攻,想换非主攻)→ 去对外查询入口(找博文家的非主攻票)
    const browseMode = entry === 1 ? 'internal' : 'public';
    const firstIntent = intentZones[0];
    const browseParams = new URLSearchParams({ mode: browseMode, presetShowDate: showDate });
    if(firstIntent){
      browseParams.set('presetCategory', firstIntent.category);
      browseParams.set('presetPrice', firstIntent.price);
      browseParams.set('presetZone', firstIntent.zone);
    }
    document.getElementById('findMatchBtn').href = `browse.html?${browseParams.toString()}`;
  } catch(err){
    showError(err.message || '提交失败,请重试');
    submitBtn.disabled = false;
    submitBtn.textContent = '提交换座信息';
  }
});

function copyLink(){
  const text = document.getElementById('magicLink').textContent;
  navigator.clipboard.writeText(text).then(() => alert('已复制,请务必保存好这个链接!'));
}

initGate();
</script>
</body>
</html>
