<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登记我的座位</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  form{ padding: 18px 18px 90px; }
  .section-title{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; color:var(--pink-deep); margin-bottom:10px; }
  .section-title .num{ width:20px; height:20px; border-radius:50%; background:var(--pink-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:'Fraunces'; }
  .cat-tabs{ display:flex; gap:8px; margin-bottom:10px; }
  .cat-tab{ flex:1; text-align:center; padding:10px 4px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font-size:12.5px; font-weight:800; color:var(--ink-soft); cursor:pointer; }
  .cat-tab.active{ background:var(--pink-deep); border-color:var(--pink-deep); color:#fff; }
  .seat-summary{ border:1.5px dashed var(--pink-pale); background:#fff8fa; border-radius:14px; padding:14px; text-align:center; font-size:12.5px; font-weight:700; color:var(--pink-deep); cursor:pointer; }
  .seat-summary.picked{ border-style:solid; border-color:var(--green); background:#f4fbf7; color:var(--green); }
  .grid-scroll{ overflow:auto; border:1.5px solid var(--line); border-radius:14px; padding:10px; margin-top:10px; max-height:50vh; -webkit-overflow-scrolling:touch; }
  .seat-grid{ display:inline-block; }
  .seat-row{ display:flex; align-items:center; gap:3px; margin-bottom:3px; }
  .seat-row-label{ width:44px; flex-shrink:0; font-size:10px; color:var(--ink-soft); font-weight:700; text-align:right; padding-right:4px; }
  .seat-cell{ width:16px; height:16px; flex-shrink:0; border-radius:4px; background:#f3e3ea; cursor:pointer; }
  .seat-cell.picked{ background:var(--pink-deep); }
  .success{ display:none; flex-direction:column; align-items:center; text-align:center; padding:40px 24px 30px; }
  .success.show{ display:flex; }
  .success-icon{ width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,var(--pink-mid),var(--pink-deep)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:30px; margin-bottom:16px; }
  .link-box{ width:100%; background:#fff3f7; border:1.5px dashed var(--pink-pale); border-radius:14px; padding:14px; font-size:12px; color:var(--pink-deep); font-weight:700; word-break:break-all; margin-bottom:14px; }

  .seat-picker-overlay{
    display:none; position:fixed; inset:0; background:#fff; z-index:50;
    flex-direction:column; max-width:420px; margin:0 auto;
  }
  .seat-picker-overlay.show{ display:flex; }
  .seat-picker-header{ display:flex; justify-content:space-between; align-items:flex-start; padding:18px 18px 12px; border-bottom:1px solid var(--line); }
  .seat-picker-title{ font-family:'Fraunces'; font-weight:700; font-size:17px; }
  .seat-picker-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .seat-picker-close{ border:none; background:#f1e4e8; width:30px; height:30px; border-radius:50%; font-size:14px; color:var(--ink-soft); cursor:pointer; }
  .seat-cell.taken{ background:var(--pink-deep); cursor:not-allowed; }
  .seat-cell.pending{ background:var(--green) !important; }
</style>
</head>
<body>
<div class="phone">
  <header class="top">
    <div class="top-row"><div class="brand">Seat Map</div><div class="watermark">YBW_Sgz</div></div>
    <h1>登记我的座位</h1>
    <div class="sub">强攻区 / 主攻区专用</div>
  </header>

  <div id="pwGate" class="stage" style="text-align:center; padding:36px 18px;">
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">请输入座位地图口令</p>
    <input type="password" id="pwInput" placeholder="输入口令" style="margin-bottom:12px;">
    <button class="btn-primary" onclick="submitPassword()">进入</button>
    <div id="pwError" class="warn-box" style="display:none; margin-top:12px;"></div>
  </div>

  <form id="theForm" style="display:none;">
    <div class="field">
      <div class="section-title"><span class="num">1</span>分类</div>
      <div class="cat-tabs" id="catTabs"></div>
    </div>

    <div class="field">
      <div class="section-title"><span class="num">2</span>分区</div>
      <select id="zoneSel" onchange="onZoneChange()"></select>
    </div>

    <div class="field">
      <div class="section-title"><span class="num">3</span>座位</div>
      <div id="seatSummary" class="seat-summary" onclick="openGrid()">👆 点击在座位图上选择我的座位</div>
    </div>

    <div class="field">
      <div class="section-title"><span class="num">4</span>联系方式</div>
      <div class="hint-box" style="margin-bottom:10px;">💡 以下四项都要填,没有的话填"/"即可</div>
      <label>微博ID</label>
      <input type="text" id="weiboId" placeholder="没有填 /">
      <label>微博主页链接</label>
      <input type="text" id="weiboLink" placeholder="没有填 /">
      <label>微信号</label>
      <input type="text" id="wechatId" placeholder="没有填 /">
      <label>手机号(请尽量填写手机号方便联系)</label>
      <input type="text" id="phoneNum" placeholder="没有填 /">
    </div>

    <div id="formError" class="warn-box" style="display:none; margin-bottom:14px;"></div>
    <button type="submit" id="submitBtn" class="btn-primary">提交登记</button>
  </form>

  <div class="success" id="successScreen">
    <div class="success-icon">✓</div>
    <h2>登记成功</h2>
    <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 20px;">
      请保存下面这个专属链接 —— 以后想撤掉这条登记要靠它。
    </p>
    <div class="link-box" id="magicLink"></div>
    <button class="btn-secondary" onclick="copyLink()">复制链接</button>
  </div>

  <div id="seatPickerOverlay" class="seat-picker-overlay">
    <div class="seat-picker-header">
      <div>
        <div class="seat-picker-title">选择我的座位</div>
        <div class="seat-picker-hint" id="pickerZoneLabel"></div>
      </div>
      <button type="button" class="seat-picker-close" onclick="closeGrid()">✕</button>
    </div>
    <div style="padding:10px 18px; font-size:11px; color:var(--ink-soft);">
      <span style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:#f3e3ea;"></span>还没人
      <span style="margin-left:14px;"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--pink-deep);"></span>已被登记</span>
    </div>
    <div class="grid-scroll" style="flex:1; margin-top:0;">
      <div id="pickerGrid" class="seat-grid"></div>
    </div>
    <div id="pendingConfirm" style="display:none; padding:14px 18px; background:#fff3f7; border-top:1.5px solid var(--pink-pale); text-align:center;">
      <div style="font-family:'Fraunces'; font-weight:700; font-size:16px; color:var(--pink-deep); margin-bottom:10px;" id="pendingText"></div>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn-secondary" style="margin-bottom:0;" onclick="cancelPending()">重新选</button>
        <button type="button" class="btn-primary" onclick="confirmPick()">确认这个座位</button>
      </div>
    </div>
    <div id="pickerDefaultFooter" style="display:flex; gap:10px; padding:14px 18px 20px; border-top:1px solid var(--line);">
      <button type="button" class="btn-secondary" onclick="closeGrid()">取消</button>
    </div>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/seatmap-zones.js"></script>
<script>
const sb = window.getSupabaseClient();
const params = new URLSearchParams(location.search);
let password = sessionStorage.getItem('seatmap_pw') || null;
let activeCat = params.get('category') || SEATMAP_CATEGORIES[0].name;
let pickedRow = params.get('row') ? parseInt(params.get('row')) : null;
let pickedSeat = params.get('seat') ? parseInt(params.get('seat')) : null;

function init(){
  document.getElementById('catTabs').innerHTML = SEATMAP_CATEGORIES.map(c => `
    <div class="cat-tab ${c.name===activeCat?'active':''}" onclick="switchCat('${c.name}')">${c.name}</div>
  `).join('');

  if(password){
    showForm();
  } else {
    document.getElementById('pwGate').style.display = 'block';
  }
}

async function submitPassword(){
  const pw = document.getElementById('pwInput').value;
  const errBox = document.getElementById('pwError');
  errBox.style.display = 'none';
  if(!pw) return;
  try {
    const res = await fetch('/.netlify/functions/seatmap-grid', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw }),
    });
    if(res.status === 401){
      errBox.textContent = '⚠ 口令不对,请再试一次';
      errBox.style.display = 'block';
      return;
    }
    if(!res.ok) throw new Error('网络错误');
    password = pw;
    sessionStorage.setItem('seatmap_pw', pw);
    showForm();
  } catch(err){
    errBox.textContent = '⚠ ' + err.message;
    errBox.style.display = 'block';
  }
}

function showForm(){
  document.getElementById('pwGate').style.display = 'none';
  document.getElementById('theForm').style.display = 'block';
  populateZoneSelect();
  if(params.get('zone')) document.getElementById('zoneSel').value = params.get('zone');
  updateSeatSummary();
}

function switchCat(name){
  activeCat = name;
  pickedRow = null; pickedSeat = null;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.textContent === name));
  populateZoneSelect();
  updateSeatSummary();
}

function populateZoneSelect(){
  const cat = SEATMAP_CATEGORIES.find(c => c.name === activeCat);
  document.getElementById('zoneSel').innerHTML = cat.zones.map(z => `<option value="${z}">${z}</option>`).join('');
}

function onZoneChange(){
  pickedRow = null; pickedSeat = null;
  updateSeatSummary();
}

function updateSeatSummary(){
  const summary = document.getElementById('seatSummary');
  if(pickedRow !== null && pickedSeat !== null){
    summary.textContent = `✓ 已选:第${pickedRow}排 ${pickedSeat}号(点击重新选)`;
    summary.classList.add('picked');
  } else {
    summary.textContent = '👆 点击在座位图上选择我的座位';
    summary.classList.remove('picked');
  }
}

async function openGrid(){
  const zone = document.getElementById('zoneSel').value;
  if(!zone){ alert('请先选分区'); return; }

  pendingCell = null;
  document.getElementById('pendingConfirm').style.display = 'none';
  document.getElementById('pickerDefaultFooter').style.display = 'flex';
  document.getElementById('pickerZoneLabel').textContent = `${activeCat} · ${zone} · 灰色格子已被登记`;

  let takenSet = new Set();
  try {
    const res = await fetch('/.netlify/functions/seatmap-grid', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password, category: activeCat, zone }),
    });
    if(res.ok){
      const json = await res.json();
      takenSet = new Set((json.data || []).map(d => `${d.row_number}-${d.seat_number}`));
    }
  } catch(e){ /* 拿不到已占用列表也不影响选座,只是少了灰色提示 */ }

  const [start, end] = window.getSeatmapRowRange(zone);
  const grid = document.getElementById('pickerGrid');
  let html = '';
  for(let r = start; r <= end; r++){
    html += `<div class="seat-row"><div class="seat-row-label">第${r}排</div>`;
    for(let s = 1; s <= SEATMAP_COLS_PER_ROW; s++){
      const taken = takenSet.has(`${r}-${s}`);
      const isPicked = pickedRow === r && pickedSeat === s;
      html += `<div class="seat-cell ${taken?'taken':''} ${isPicked?'picked':''}" data-row="${r}" data-seat="${s}" data-taken="${taken}"></div>`;
    }
    html += `</div>`;
  }
  grid.innerHTML = html;
  document.getElementById('seatPickerOverlay').classList.add('show');
}

function closeGrid(){
  document.getElementById('seatPickerOverlay').classList.remove('show');
  cancelPending();
}

let pendingCell = null;

document.getElementById('pickerGrid').addEventListener('click', (e) => {
  const cell = e.target.closest('.seat-cell');
  if(!cell || cell.dataset.taken === 'true') return;
  if(pendingCell) pendingCell.classList.remove('pending');

  pendingCell = cell;
  cell.classList.add('pending');
  document.getElementById('pendingText').textContent = `第${cell.dataset.row}排 ${cell.dataset.seat}号`;
  document.getElementById('pendingConfirm').style.display = 'block';
  document.getElementById('pickerDefaultFooter').style.display = 'none';
});

function cancelPending(){
  if(pendingCell) pendingCell.classList.remove('pending');
  pendingCell = null;
  document.getElementById('pendingConfirm').style.display = 'none';
  document.getElementById('pickerDefaultFooter').style.display = 'flex';
}

function confirmPick(){
  if(!pendingCell) return;
  pickedRow = parseInt(pendingCell.dataset.row);
  pickedSeat = parseInt(pendingCell.dataset.seat);
  pendingCell = null;
  updateSeatSummary();
  document.getElementById('pendingConfirm').style.display = 'none';
  document.getElementById('pickerDefaultFooter').style.display = 'flex';
  closeGridSilently();
}

function closeGridSilently(){
  document.getElementById('seatPickerOverlay').classList.remove('show');
}

function showError(msg){
  const box = document.getElementById('formError');
  box.textContent = '⚠ ' + msg;
  box.style.display = 'block';
}
function clearError(){ document.getElementById('formError').style.display = 'none'; }

document.getElementById('theForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();

  const zone = document.getElementById('zoneSel').value;
  const weiboId = document.getElementById('weiboId').value.trim();
  const weiboLink = document.getElementById('weiboLink').value.trim();
  const wechatId = document.getElementById('wechatId').value.trim();
  const phoneNum = document.getElementById('phoneNum').value.trim();

  if(!zone) return showError('请选择分区');
  if(pickedRow === null || pickedSeat === null) return showError('请先在座位图上选好座位');
  if(!weiboId || !weiboLink || !wechatId || !phoneNum) return showError('联系方式四项都要填,没有请填 /');

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = '提交中...';

  const editToken = crypto.randomUUID();
  const row = {
    category: activeCat, zone,
    row_number: pickedRow, seat_number: pickedSeat,
    weibo_id: weiboId, weibo_link: weiboLink,
    wechat_id: wechatId, phone: phoneNum,
    edit_token: editToken,
  };

  const { error } = await sb.from('seatmap_entries').insert(row);
  if(error){
    if(error.code === '23505'){ // unique_violation
      showError('这个座位刚好被别人抢先登记了,换一个格子试试');
    } else {
      showError(error.message || '提交失败,请重试');
    }
    submitBtn.disabled = false;
    submitBtn.textContent = '提交登记';
    return;
  }

  const link = `${location.origin}/seatmap-edit.html?token=${editToken}`;
  document.getElementById('magicLink').textContent = link;
  document.getElementById('theForm').style.display = 'none';
  document.getElementById('successScreen').classList.add('show');
});

function copyLink(){
  const text = document.getElementById('magicLink').textContent;
  navigator.clipboard.writeText(text).then(() => alert('已复制,请务必保存好这个链接!'));
}

init();
</script>
</body>
</html>
